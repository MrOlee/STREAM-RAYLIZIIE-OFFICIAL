<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM RAYLIZIIE OFFICIAL</title>
  
  <!-- Tailwind CSS Compiled -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen">

  <!-- NAVBAR -->
  <nav class="flex items-center justify-between px-6 py-4 bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">
        STREAM
      </div>
      <span class="text-sm font-semibold tracking-wide text-gray-300">RAYLIZIIE OFFICIAL</span>
    </div>
    
    <div class="relative w-72">
      <input 
        type="text" 
        placeholder="Cari tayangan..." 
        class="w-full bg-gray-800 text-sm text-white rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-orange-500 border border-gray-700"
      >
      <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
  </nav>

  <!-- FEATURED BANNER SECTION -->
  <header class="relative w-full bg-gradient-to-r from-gray-950 via-gray-900 to-transparent py-12 px-8 flex flex-col justify-center min-h-[320px]">
    <div class="max-w-2xl z-10">
      <span class="bg-orange-600 text-white text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider">
        FEATURED
      </span>
      <h1 id="featuredTitle" class="text-3xl sm:text-5xl font-extrabold mt-3 leading-tight">
        Memuat Konten...
      </h1>
      <p class="text-gray-400 text-sm mt-3">
        Saksikan penayangan lengkapnya secara gratis di STREAM RAYLIZIIE OFFICIAL.
      </p>
      <div class="mt-6">
        <button 
          id="btnTontonFeatured"
          class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2.5 rounded-lg flex items-center space-x-2 transition cursor-pointer"
        >
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Tonton Sekarang</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="px-6 py-8 space-y-10">
    
    <!-- ANIME SECTION -->
    <section>
      <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
        <span class="w-1.5 h-6 bg-orange-500 rounded-full"></span>
        <span>Anime Terbaru & Trending</span>
      </h2>
      <div id="animeContainer" class="flex space-x-4 overflow-x-auto no-scrollbar py-2">
        <p class="text-gray-500 text-sm">Memuat anime...</p>
      </div>
    </section>

    <!-- DRAKOR SECTION -->
    <section>
      <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
        <span class="w-1.5 h-6 bg-pink-500 rounded-full"></span>
        <span>Drama Korea & Asia</span>
      </h2>
      <div id="drakorContainer" class="flex space-x-4 overflow-x-auto no-scrollbar py-2">
        <p class="text-gray-500 text-sm">Konten drakor akan segera hadir.</p>
      </div>
    </section>

    <!-- FILM SECTION -->
    <section>
      <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
        <span class="w-1.5 h-6 bg-blue-500 rounded-full"></span>
        <span>Bioskop & Film</span>
      </h2>
      <div id="filmContainer" class="flex space-x-4 overflow-x-auto no-scrollbar py-2">
        <p class="text-gray-500 text-sm">Konten film akan segera hadir.</p>
      </div>
    </section>

  </main>

  <!-- MODAL STREAM PLAYER VIDEO -->
  <div id="playerModal" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-900 w-full max-w-4xl rounded-xl overflow-hidden border border-gray-800 relative">
      <div class="flex items-center justify-between p-4 border-b border-gray-800">
        <h3 id="playerModalTitle" class="font-bold text-white truncate pr-4">Memuat Video...</h3>
        <button onclick="closePlayerModal()" class="text-gray-400 hover:text-white font-bold text-2xl leading-none">&times;</button>
      </div>
      <div class="relative aspect-video bg-black">
        <iframe id="playerIframe" class="w-full h-full border-0" allowfullscreen src=""></iframe>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const API_BASE_URL = 'https://api-rayliziie.rayyan-official.site';
    const SAFE_PLACEHOLDER = 'https://placehold.co/300x450/1e293b/ffffff?text=No+Poster';

    function fixImageUrl(url) {
      if (!url || url.includes('via.placeholder.com')) {
        return SAFE_PLACEHOLDER;
      }
      return url;
    }

    async function openPlayerModal(itemId) {
      if (!itemId || itemId === 'undefined' || itemId.trim() === '') {
        alert('Maaf, ID tayangan ini tidak valid.');
        return;
      }

      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('playerIframe');
      const titleEl = document.getElementById('playerModalTitle');

      titleEl.innerText = 'Memuat Player...';
      iframe.src = '';
      modal.classList.remove('hidden');

      try {
        const response = await fetch(`${API_BASE_URL}/play?id=${encodeURIComponent(itemId)}`);
        const json = await response.json();

        if (json.code === 0 && json.data && json.data.stream_url) {
          titleEl.innerText = json.data.title || 'Streaming Video';
          iframe.src = json.data.stream_url;
        } else {
          titleEl.innerText = 'Gagal Memuat Video';
          alert(json.message || 'Stream video tidak dapat diputar.');
        }
      } catch (err) {
        console.error('Error open player:', err);
        titleEl.innerText = 'Terjadi Kesalahan';
      }
    }

    function closePlayerModal() {
      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('playerIframe');
      iframe.src = '';
      modal.classList.add('hidden');
    }

    function createCard(item) {
      const validId = item.id || item.path || item.slug;
      const coverUrl = fixImageUrl(item.cover_url || item.poster || item.image);
      const title = item.title || 'Untitled';

      return `
        <div 
          onclick="openPlayerModal('${validId}')" 
          class="flex-none w-40 sm:w-48 bg-gray-900 rounded-lg overflow-hidden shadow-lg border border-gray-800 hover:border-orange-500 transition group cursor-pointer"
        >
          <div class="relative aspect-[3/4] bg-gray-800">
            <img 
              src="${coverUrl}" 
              alt="${title}"
              loading="lazy"
              onerror="this.onerror=null; this.src='${SAFE_PLACEHOLDER}';"
              class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
            />
          </div>
          <div class="p-3">
            <h3 class="text-sm font-semibold text-white truncate group-hover:text-orange-400">
              ${title}
            </h3>
          </div>
        </div>
      `;
    }

    // 1. FETCH ANIME (ISOLATED & SAFE)
    async function fetchAnime() {
      const container = document.getElementById('animeContainer');
      try {
        const res = await fetch(`${API_BASE_URL}/animekompi/home`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (json.code === 0 && json.data && json.data.length > 0) {
          container.innerHTML = json.data.map(item => createCard(item)).join('');
          
          // Set Featured Header
          const first = json.data[0];
          document.getElementById('featuredTitle').innerText = first.title;
          document.getElementById('btnTontonFeatured').onclick = () => openPlayerModal(first.id || first.path);
        } else {
          container.innerHTML = `<p class="text-gray-500 text-sm">Tidak ada data anime.</p>`;
        }
      } catch (err) {
        console.error('Anime Fetch Error:', err);
        container.innerHTML = `<p class="text-red-400 text-sm">Gagal memuat anime.</p>`;
      }
    }

    // 2. FETCH DRAKOR (HANDLES 404 SILENTLY)
    async function fetchDrakor() {
      const container = document.getElementById('drakorContainer');
      try {
        const res = await fetch(`${API_BASE_URL}/dramovnime/tab`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (json.code === 0 && json.data && json.data.length > 0) {
          container.innerHTML = json.data.map(item => createCard(item)).join('');
        } else {
          container.innerHTML = `<p class="text-gray-500 text-sm">Konten Drakor belum tersedia.</p>`;
        }
      } catch (err) {
        // Jangan menghentikan aplikasi jika 404
        container.innerHTML = `<p class="text-gray-500 text-sm">Segera hadir.</p>`;
      }
    }

    // 3. FETCH FILM (HANDLES 404 SILENTLY)
    async function fetchFilm() {
      const container = document.getElementById('filmContainer');
      try {
        const res = await fetch(`${API_BASE_URL}/filmbox/home`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (json.code === 0 && json.data && json.data.length > 0) {
          container.innerHTML = json.data.map(item => createCard(item)).join('');
        } else {
          container.innerHTML = `<p class="text-gray-500 text-sm">Konten Film belum tersedia.</p>`;
        }
      } catch (err) {
        // Jangan menghentikan aplikasi jika 404
        container.innerHTML = `<p class="text-gray-500 text-sm">Segera hadir.</p>`;
      }
    }

    // Jalankan semua fetch secara mandiri
    document.addEventListener('DOMContentLoaded', () => {
      fetchAnime();
      fetchDrakor();
      fetchFilm();
    });
  </script>
</body>
</html>
