<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKompi Streaming & Information</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
                <span class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl">
                    <i class="fa-solid fa-play"></i>
                </span>
                <span class="font-extrabold text-xl tracking-wide bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">
                    AnimeKompi
                </span>
            </div>

            <!-- Navigation Tabs (Desktop) -->
            <nav class="hidden md:flex space-x-1 text-sm font-medium">
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn px-4 py-2 rounded-lg transition-colors bg-indigo-600 text-white">Home</button>
                <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">Jadwal Rilis</button>
                <button onclick="switchTab('genres')" id="nav-genres" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">Genre</button>
                <button onclick="switchTab('list')" id="nav-list" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">Daftar Anime</button>
            </nav>

            <!-- Status Indicator -->
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Vercel API Active
                </span>
            </div>
        </div>

        <!-- Mobile Nav -->
        <div class="md:hidden flex justify-around border-t border-gray-800 py-2 bg-gray-900 text-xs font-medium">
            <button onclick="switchTab('home')" class="mobile-nav-btn text-indigo-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-house text-base"></i> Home
            </button>
            <button onclick="switchTab('schedule')" class="mobile-nav-btn text-gray-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-calendar-days text-base"></i> Jadwal
            </button>
            <button onclick="switchTab('genres')" class="mobile-nav-btn text-gray-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-tags text-base"></i> Genre
            </button>
            <button onclick="switchTab('list')" class="mobile-nav-btn text-gray-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-list-ul text-base"></i> List
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Global Loading Indicator -->
        <div id="loading" class="hidden flex-col items-center justify-center py-20 gap-3">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-gray-400 animate-pulse">Memuat data anime...</p>
        </div>

        <!-- Error Message Container -->
        <div id="error-container" class="hidden bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-xl mb-6 text-sm">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-xl text-red-400"></i>
                <div>
                    <p class="font-bold">Gagal mengambil data dari API</p>
                    <p id="error-text" class="text-xs text-red-300 mt-0.5"></p>
                </div>
            </div>
            <button onclick="retryFetch()" class="mt-3 px-3 py-1.5 bg-red-800 hover:bg-red-700 text-white rounded text-xs font-semibold transition-colors">
                <i class="fa-solid fa-rotate-right mr-1"></i> Coba Muat Ulang
            </button>
        </div>

        <!-- TAB 1: HOME -->
        <section id="tab-home" class="tab-content space-y-10">
            <div>
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-amber-500"></i> Featured Spotlight
                </h2>
                <div id="slider-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-indigo-400"></i> Trending Hari Ini
                </h2>
                <div id="trending-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>

            <div>
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-pink-400"></i> Update Terbaru
                </h2>
                <div id="latest-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </section>

        <!-- TAB 2: SCHEDULE -->
        <section id="tab-schedule" class="tab-content hidden space-y-6">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-emerald-400"></i> Jadwal Rilis Mingguan
            </h2>
            <div id="day-tabs" class="flex gap-2 overflow-x-auto pb-2 border-b border-gray-800"></div>
            <div id="schedule-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- TAB 3: GENRES -->
        <section id="tab-genres" class="tab-content hidden space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-purple-400"></i> Kategori Genre
                </h2>
                <button id="back-genre-btn" onclick="loadGenresList()" class="hidden text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Semua Genre
                </button>
            </div>
            <div id="genre-list" class="flex flex-wrap gap-2"></div>
            <div id="genre-detail-container" class="hidden space-y-4">
                <h3 id="selected-genre-title" class="text-lg font-semibold text-indigo-400"></h3>
                <div id="genre-anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </section>

        <!-- TAB 4: LIST ANIME -->
        <section id="tab-list" class="tab-content hidden space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark text-cyan-400"></i> Semua Koleksi Anime
                </h2>
                <div class="relative w-full sm:w-64">
                    <input type="text" id="anime-search" oninput="filterAnimeList()" placeholder="Cari judul anime..." 
                           class="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 pl-9 text-xs text-gray-200 focus:outline-none focus:border-indigo-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                </div>
            </div>
            <div id="alpha-groups" class="flex gap-1 flex-wrap pb-2 border-b border-gray-800"></div>
            <div id="anime-list-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
        </section>

    </main>

    <!-- STREAMING & DETAIL MODAL -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-gray-800/80 hover:bg-gray-700 text-gray-300 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Video Player Box -->
            <div id="player-container" class="w-full aspect-video bg-black relative rounded-t-2xl overflow-hidden flex items-center justify-center border-b border-gray-800">
                <div id="player-placeholder" class="text-center p-6">
                    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p class="text-xs text-gray-400">Memuat Pemutar Video...</p>
                </div>
                <iframe id="video-iframe" class="w-full h-full hidden" allowfullscreen frameborder="0" allow="autoplay; encrypted-media"></iframe>
            </div>

            <!-- Modal Content -->
            <div class="p-6 space-y-6">
                <div>
                    <h2 id="modal-title" class="text-xl font-bold text-white mb-2"></h2>
                    <div id="modal-meta" class="flex flex-wrap gap-2 text-xs text-gray-400"></div>
                </div>

                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Sinopsis</h3>
                    <p id="modal-synopsis" class="text-xs text-gray-300 leading-relaxed"></p>
                </div>

                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-list text-indigo-400"></i> Pilih Episode
                    </h3>
                    <div id="episode-list" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-1"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        const API_KEY = "bb47332ceca91e3a2c97128a40c798a69306400072cc4b5a352800697069e45c";
        const BASE_URL = "/api-proxy";
        
        let activeTab = 'home';
        let fullAnimeList = [];
        let rawScheduleData = [];

        window.animeCache = {};

        const placeholderImg = "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=80";

        function storeAnime(item) {
            const key = 'item_' + Math.random().toString(36).substring(2, 11);
            window.animeCache[key] = item;
            return key;
        }

        function getEpTarget(ep) {
            if (!ep) return '';
            if (typeof ep === 'string') return ep.trim();
            
            const keys = [
                'path', 'endpoint', 'episode_endpoint', 'url', 'link', 'id', 'slug', 
                'stream_url', 'embed_url', 'href', 'episode_id', 'episode_slug', 
                'target', 'param', 'value', 'key'
            ];
            
            for (const k of keys) {
                if (ep[k] && typeof ep[k] === 'string' && ep[k].trim() !== '') {
                    return ep[k].trim();
                }
            }
            
            for (const [key, val] of Object.entries(ep)) {
                if (typeof val === 'string' && val.trim() !== '' && !['title', 'name', 'episode', 'number', 'status', 'date'].includes(key.toLowerCase())) {
                    return val.trim();
                }
            }
            return '';
        }

        function findStreamUrl(obj) {
            if (!obj) return null;
            
            if (typeof obj === 'string') {
                const str = obj.trim();
                if ((str.startsWith('http://') || str.startsWith('https://')) &&
                    !str.match(/\.(jpg|jpeg|png|gif|webp|css|js|woff|woff2|ttf|json)($|\?)/i)) {
                    return str;
                }
                return null;
            }

            if (typeof obj === 'object') {
                const priorityKeys = ['embed_url', 'stream_url', 'iframe', 'url', 'link', 'stream', 'file', 'src', 'embed'];
                for (const k of priorityKeys) {
                    if (obj[k]) {
                        const found = findStreamUrl(obj[k]);
                        if (found) return found;
                    }
                }
                if (Array.isArray(obj)) {
                    for (const item of obj) {
                        const found = findStreamUrl(item);
                        if (found) return found;
                    }
                }
                for (const [k, v] of Object.entries(obj)) {
                    if (!priorityKeys.includes(k)) {
                        const found = findStreamUrl(v);
                        if (found) return found;
                    }
                }
            }
            return null;
        }

        async function apiFetch(endpoint, silent = false) {
            if (!silent) showLoading(true);
            hideError();

            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error Status: ${response.status}`);
                }

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const json = await response.json();
                    if (!silent) showLoading(false);
                    return json;
                } else {
                    const text = await response.text();
                    if (!silent) showLoading(false);
                    return { htmlText: text };
                }
            } catch (err) {
                if (!silent) showLoading(false);
                if (!silent) showError(err.message || 'Gagal tersambung ke API.');
                throw err;
            }
        }

        function showLoading(state) {
            document.getElementById('loading').className = state ? 'flex flex-col items-center justify-center py-20 gap-3' : 'hidden';
        }

        function showError(msg) {
            const errBox = document.getElementById('error-container');
            document.getElementById('error-text').innerText = msg;
            errBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-container').classList.add('hidden');
        }

        function retryFetch() {
            switchTab(activeTab);
        }

        function switchTab(tabName) {
            activeTab = tabName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors";
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) activeNav.className = "nav-btn px-4 py-2 rounded-lg transition-colors bg-indigo-600 text-white font-semibold";

            document.querySelectorAll('.tab-content').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            if (tabName === 'home') loadHomeData();
            else if (tabName === 'schedule') loadScheduleData();
            else if (tabName === 'genres') loadGenresList();
            else if (tabName === 'list') loadAnimeList();
        }

        async function loadHomeData() {
            try {
                const res = await apiFetch('/home?page=1');
                if (res.code === 0 && res.data) {
                    renderSliders(res.data.sliders || []);
                    renderAnimeGrid('trending-grid', res.data.trending_today || [], true);
                    renderAnimeGrid('latest-grid', res.data.latest_updates || [], false);
                }
            } catch (e) { console.error(e); }
        }

        function renderSliders(sliders) {
            const container = document.getElementById('slider-container');
            container.innerHTML = sliders.slice(0, 4).map(item => {
                const key = storeAnime(item);
                return `
                <div onclick="handleAnimeClick('${key}')" 
                     class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex flex-col sm:flex-row h-auto sm:h-48 group hover:border-indigo-500/50 transition-all cursor-pointer">
                    <img src="${item.cover_url || item.thumb}" referrerpolicy="no-referrer" onerror="this.src='${placeholderImg}'" alt="${item.title}" class="w-full sm:w-36 h-48 sm:h-full object-cover">
                    <div class="p-4 flex flex-col justify-between flex-1">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-indigo-900/60 text-indigo-300 text-[10px] px-2 py-0.5 rounded border border-indigo-700/50">${item.release_year || 'Anime'}</span>
                                <span class="text-xs text-gray-400">${item.genres ? item.genres.slice(0, 2).join(', ') : ''}</span>
                            </div>
                            <h3 class="font-bold text-gray-100 text-sm line-clamp-1 group-hover:text-indigo-400 transition-colors">${item.title}</h3>
                            <p class="text-xs text-gray-400 mt-2 line-clamp-3">${item.deskripsi || 'Klik untuk menonton episode.'}</p>
                        </div>
                        <div class="mt-3">
                            <span class="text-xs text-indigo-400 font-semibold flex items-center gap-1 group-hover:underline">
                                <i class="fa-solid fa-circle-play text-sm"></i> Tonton Sekarang
                            </span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderAnimeGrid(elementId, items, isTrending = false) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = items.map(item => {
                const key = storeAnime(item);
                return `
                <div onclick="handleAnimeClick('${key}')" 
                     class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex flex-col group hover:border-indigo-500/50 hover:shadow-lg transition-all cursor-pointer">
                    <div class="relative overflow-hidden aspect-[3/4]">
                        <img src="${item.cover_url || item.thumb}" referrerpolicy="no-referrer" onerror="this.src='${placeholderImg}'" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        ${item.episode ? `<span class="absolute top-2 right-2 bg-indigo-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded">Eps ${item.episode}</span>` : ''}
                        ${isTrending && item.rank ? `<span class="absolute top-2 left-2 bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded">#${item.rank}</span>` : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <h4 class="font-semibold text-xs text-gray-200 line-clamp-2 group-hover:text-indigo-400 transition-colors">${item.title}</h4>
                    </div>
                </div>
            `}).join('');
        }

        async function loadScheduleData() {
            try {
                const res = await apiFetch('/schedule');
                if (res.code === 0 && Array.isArray(res.data)) {
                    rawScheduleData = res.data;
                    renderScheduleTabs(rawScheduleData);
                    if (rawScheduleData.length > 0) renderScheduleDay(rawScheduleData[0].day);
                }
            } catch (e) { console.error(e); }
        }

        function renderScheduleTabs(data) {
            const container = document.getElementById('day-tabs');
            container.innerHTML = data.map((dayObj, idx) => `
                <button onclick="renderScheduleDay('${dayObj.day}')" id="day-btn-${dayObj.day}" 
                        class="day-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-800'}">
                    ${dayObj.day} (${dayObj.total_items})
                </button>
            `).join('');
        }

        function renderScheduleDay(dayName) {
            document.querySelectorAll('.day-btn').forEach(b => b.className = "day-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors bg-gray-900 text-gray-400 hover:bg-gray-800");
            const activeBtn = document.getElementById(`day-btn-${dayName}`);
            if (activeBtn) activeBtn.className = "day-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors bg-indigo-600 text-white";

            const dayData = rawScheduleData.find(d => d.day === dayName);
            const grid = document.getElementById('schedule-grid');

            if (!dayData || !dayData.animes.length) {
                grid.innerHTML = `<p class="col-span-full text-xs text-gray-500 py-10 text-center">Tidak ada rilis anime untuk hari ini.</p>`;
                return;
            }

            grid.innerHTML = dayData.animes.map(item => {
                const key = storeAnime(item);
                return `
                <div onclick="handleAnimeClick('${key}')" 
                     class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex flex-col group hover:border-indigo-500/50 transition-all cursor-pointer">
                    <div class="relative overflow-hidden aspect-[3/4]">
                        <img src="${item.cover_url || item.thumb}" referrerpolicy="no-referrer" onerror="this.src='${placeholderImg}'" alt="${item.title}" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 left-2 bg-gray-950/80 backdrop-blur text-emerald-400 text-[10px] font-semibold px-2 py-0.5 rounded border border-emerald-500/30">
                            <i class="fa-regular fa-clock mr-1"></i>${item.status}
                        </span>
                    </div>
                    <div class="p-3">
                        <span class="text-[10px] text-gray-400 block mb-1">Episode ${item.episode}</span>
                        <h4 class="font-semibold text-xs text-gray-200 line-clamp-2 group-hover:text-indigo-400 transition-colors">${item.title}</h4>
                    </div>
                </div>
            `}).join('');
        }

        async function loadGenresList() {
            document.getElementById('genre-list').classList.remove('hidden');
            document.getElementById('genre-detail-container').classList.add('hidden');
            document.getElementById('back-genre-btn').classList.add('hidden');

            try {
                const res = await apiFetch('/genres');
                if (res.code === 0 && res.data && res.data.genres_list) {
                    const container = document.getElementById('genre-list');
                    container.innerHTML = res.data.genres_list.map(g => `
                        <button onclick="loadGenreDetail('${g.genre_id}', '${g.name}')" 
                                class="bg-gray-900 hover:bg-indigo-600/20 hover:border-indigo-500 border border-gray-800 px-3 py-1.5 rounded-lg text-xs text-gray-300 transition-all flex items-center gap-2">
                            <span>${g.name}</span>
                            <span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded-full">${g.count}</span>
                        </button>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function loadGenreDetail(genreId, genreName) {
            document.getElementById('genre-list').classList.add('hidden');
            document.getElementById('genre-detail-container').classList.remove('hidden');
            document.getElementById('back-genre-btn').classList.remove('hidden');
            document.getElementById('selected-genre-title').innerText = `Genre: ${genreName}`;

            try {
                const res = await apiFetch(`/genre-detail?genre=${genreId}&page=1`);
                if (res.code === 0 && res.data && res.data.animes) {
                    const grid = document.getElementById('genre-anime-grid');
                    grid.innerHTML = res.data.animes.map(item => {
                        const key = storeAnime(item);
                        return `
                        <div onclick="handleAnimeClick('${key}')" 
                             class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden flex flex-col group hover:border-indigo-500/50 transition-all cursor-pointer">
                            <div class="relative overflow-hidden aspect-[3/4]">
                                <img src="${item.cover_url || item.thumb}" referrerpolicy="no-referrer" onerror="this.src='${placeholderImg}'" alt="${item.title}" class="w-full h-full object-cover">
                                ${item.type ? `<span class="absolute top-2 left-2 bg-gray-950/80 text-gray-300 text-[10px] font-bold px-1.5 py-0.5 rounded">${item.type}</span>` : ''}
                            </div>
                            <div class="p-3">
                                <h4 class="font-semibold text-xs text-gray-200 line-clamp-2 group-hover:text-indigo-400 transition-colors">${item.title}</h4>
                            </div>
                        </div>
                    `}).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function loadAnimeList() {
            try {
                const res = await apiFetch('/list');
                if (res.code === 0 && Array.isArray(res.data)) {
                    fullAnimeList = res.data;
                    renderAlphaGroups(fullAnimeList);
                    if (fullAnimeList.length > 0) renderAnimeListGroup(fullAnimeList[0].group);
                }
            } catch (e) { console.error(e); }
        }

        function renderAlphaGroups(data) {
            const container = document.getElementById('alpha-groups');
            container.innerHTML = data.map((grp, idx) => `
                <button onclick="renderAnimeListGroup('${grp.group}')" id="grp-btn-${grp.group}" 
                        class="grp-btn px-2.5 py-1 rounded border border-gray-800 text-xs font-bold text-gray-400 hover:border-indigo-500 transition-colors ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-gray-900'}">
                    ${grp.group}
                </button>
            `).join('');
        }

        function renderAnimeListGroup(groupKey) {
            document.querySelectorAll('.grp-btn').forEach(b => b.classList.remove('bg-indigo-600', 'text-white'));
            const activeBtn = document.getElementById(`grp-btn-${groupKey}`);
            if (activeBtn) activeBtn.classList.add('bg-indigo-600', 'text-white');

            const groupObj = fullAnimeList.find(g => g.group === groupKey);
            const container = document.getElementById('anime-list-grid');

            if (!groupObj || !groupObj.animes.length) {
                container.innerHTML = `<p class="col-span-full text-xs text-gray-500 py-10">Kosong.</p>`;
                return;
            }

            container.innerHTML = groupObj.animes.map(item => {
                const key = storeAnime(item);
                return `
                <div onclick="handleAnimeClick('${key}')" 
                     class="bg-gray-900 border border-gray-800 p-3 rounded-lg flex items-center justify-between hover:border-indigo-500 transition-all cursor-pointer group">
                    <span class="text-xs text-gray-200 font-medium truncate pr-2 group-hover:text-indigo-400">${item.title}</span>
                    <i class="fa-solid fa-play text-[10px] text-gray-600 group-hover:text-indigo-400"></i>
                </div>
            `}).join('');
        }

        function filterAnimeList() {
            const query = document.getElementById('anime-search').value.toLowerCase().trim();
            const container = document.getElementById('anime-list-grid');

            if (!query) {
                if (fullAnimeList.length > 0) renderAnimeListGroup(fullAnimeList[0].group);
                return;
            }

            let matches = [];
            fullAnimeList.forEach(grp => {
                grp.animes.forEach(a => {
                    if (a.title.toLowerCase().includes(query)) matches.push(a);
                });
            });

            if (matches.length === 0) {
                container.innerHTML = `<p class="col-span-full text-xs text-gray-500 py-10 text-center">Tidak ada anime yang cocok dengan "${query}".</p>`;
                return;
            }

            container.innerHTML = matches.slice(0, 60).map(item => {
                const key = storeAnime(item);
                return `
                <div onclick="handleAnimeClick('${key}')" 
                     class="bg-gray-900 border border-gray-800 p-3 rounded-lg flex items-center justify-between hover:border-indigo-500 transition-all cursor-pointer group">
                    <span class="text-xs text-gray-200 font-medium truncate pr-2 group-hover:text-indigo-400">${item.title}</span>
                    <i class="fa-solid fa-play text-[10px] text-gray-600 group-hover:text-indigo-400"></i>
                </div>
            `}).join('');
        }

        function handleAnimeClick(cacheKey) {
            const item = window.animeCache[cacheKey];
            if (item) {
                openAnimeDetail(item);
            }
        }

        async function openAnimeDetail(item) {
            const modal = document.getElementById('detail-modal');
            const placeholder = document.getElementById('player-placeholder');
            const iframe = document.getElementById('video-iframe');
            const titleEl = document.getElementById('modal-title');
            const metaEl = document.getElementById('modal-meta');
            const synopEl = document.getElementById('modal-synopsis');
            const epListEl = document.getElementById('episode-list');

            const animeTitle = item.title || 'Detail Anime';

            const rawTargets = [
                item.path, item.endpoint, item.url, item.link, item.id, item.slug, item.param, item.anime_id
            ].filter(Boolean);

            if (item.title) {
                const generatedSlug = item.title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
                rawTargets.push(generatedSlug);
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            iframe.classList.add('hidden');
            iframe.src = '';
            placeholder.classList.remove('hidden');
            
            titleEl.innerText = animeTitle;
            metaEl.innerHTML = `<span class="bg-gray-800 px-2 py-0.5 rounded text-[10px]">Memuat detail...</span>`;
            synopEl.innerText = 'Mengambil sinopsis dan daftar episode...';
            epListEl.innerHTML = '<div class="text-xs text-gray-500">Memuat episode...</div>';

            let res = null;
            const paramKeys = ['path', 'endpoint', 'url', 'id', 'param', 'slug'];

            searchLoop:
            for (const targetVal of rawTargets) {
                for (const key of paramKeys) {
                    try {
                        const testUrl = `/detail?${key}=${encodeURIComponent(targetVal)}`;
                        const testRes = await apiFetch(testUrl, true);
                        if (testRes && (testRes.code === 0 || testRes.data || testRes.title || testRes.episodes)) {
                            res = testRes;
                            break searchLoop;
                        }
                    } catch (e) {}
                }
            }

            const detail = res ? (res.data || res) : null;

            if (detail) {
                titleEl.innerText = detail.title || animeTitle;
                synopEl.innerText = detail.synopsis || detail.deskripsi || item.deskripsi || 'Tidak ada deskripsi sinopsis.';
                
                metaEl.innerHTML = `
                    ${detail.status || item.status ? `<span class="bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700/50">${detail.status || item.status}</span>` : ''}
                    ${detail.rating ? `<span class="bg-amber-900/60 text-amber-300 px-2 py-0.5 rounded border border-amber-700/50"><i class="fa-solid fa-star mr-1"></i>${detail.rating}</span>` : ''}
                    ${detail.genres ? detail.genres.map(g => `<span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded">${g}</span>`).join('') : ''}
                `;

                const episodes = detail.episodes || detail.episode_list || detail.episodes_list || [];
                if (episodes.length > 0) {
                    epListEl.innerHTML = episodes.map((ep, idx) => {
                        const epTitle = (typeof ep === 'object' && (ep.title || ep.name || ep.episode)) ? (ep.title || ep.name || `Episode ${ep.episode}`) : `Episode ${idx + 1}`;
                        const epKey = storeAnime({ epObj: ep });
                        return `
                        <button onclick="playEpisodeFromCache('${epKey}')" 
                                class="ep-btn px-3 py-1.5 bg-gray-800 hover:bg-indigo-600 text-gray-200 rounded text-xs font-semibold transition-colors flex items-center gap-1.5">
                            <i class="fa-solid fa-play text-[10px]"></i> ${epTitle}
                        </button>
                    `}).join('');

                    playEpisode(episodes[0]);
                } else if (detail.stream_url || detail.embed_url || detail.url) {
                    playEpisode(detail.stream_url || detail.embed_url || detail.url);
                    epListEl.innerHTML = `<span class="text-xs text-emerald-400">Episode Tunggal / Movie</span>`;
                } else {
                    epListEl.innerHTML = `<span class="text-xs text-gray-500">Belum ada link episode yang tersedia.</span>`;
                    placeholder.innerHTML = `<p class="text-xs text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Sumber pemutar video tidak ditemukan.</p>`;
                }
            } else {
                synopEl.innerText = item.deskripsi || "Gagal memuat detail anime dari server.";
                epListEl.innerHTML = `<span class="text-xs text-gray-500">Gagal mengambil daftar episode.</span>`;
                placeholder.innerHTML = `<p class="text-xs text-red-400"><i class="fa-solid fa-circle-xmark mr-1"></i> Gagal memuat detail anime.</p>`;
            }
        }

        function playEpisodeFromCache(cacheKey) {
            const item = window.animeCache[cacheKey];
            if (item && item.epObj) {
                playEpisode(item.epObj);
            }
        }

        async function playEpisode(targetInput) {
            const iframe = document.getElementById('video-iframe');
            const placeholder = document.getElementById('player-placeholder');

            placeholder.classList.remove('hidden');
            iframe.classList.add('hidden');
            iframe.src = '';

            placeholder.innerHTML = `
                <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p class="text-xs text-gray-400 animate-pulse">Memuat pemutar video...</p>
            `;

            if (typeof targetInput === 'object') {
                const directUrl = findStreamUrl(targetInput);
                if (directUrl) {
                    placeholder.classList.add('hidden');
                    iframe.classList.remove('hidden');
                    iframe.src = directUrl;
                    return;
                }
            }

            let targetStr = getEpTarget(targetInput);
            if (!targetStr && typeof targetInput === 'object') {
                targetStr = targetInput.path || targetInput.endpoint || targetInput.url || targetInput.link || targetInput.slug || '';
            }

            if (!targetStr) {
                placeholder.innerHTML = `<p class="text-xs text-amber-400 p-4">Target episode tidak valid.</p>`;
                return;
            }

            if (targetStr.startsWith('http://') || targetStr.startsWith('https://')) {
                placeholder.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = targetStr;
                return;
            }

            let resolvedUrl = null;
            const possibleEndpoints = ['/streaming', '/episode', '/watch', '/detail'];

            for (const epEndpoint of possibleEndpoints) {
                try {
                    const res = await apiFetch(`${epEndpoint}?path=${encodeURIComponent(targetStr)}`, true);
                    if (res) {
                        resolvedUrl = findStreamUrl(res);
                        if (resolvedUrl) break;
                    }
                } catch (e) {}
            }

            if (resolvedUrl) {
                placeholder.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = resolvedUrl;
            } else {
                placeholder.classList.add('hidden');
                iframe.classList.add('hidden');
                placeholder.innerHTML = `
                    <div class="p-4 text-center max-w-md mx-auto">
                        <i class="fa-solid fa-circle-exclamation text-amber-400 text-2xl mb-2"></i>
                        <p class="text-xs font-semibold text-gray-200 mb-1">Gagal mengambil URL pemutar dari episode ini.</p>
                        <p class="text-[11px] text-gray-400">Slug: ${targetStr}</p>
                    </div>
                `;
            }
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const iframe = document.getElementById('video-iframe');
            modal.classList.add('hidden');
            iframe.src = '';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('home');
        });
    </script>
</body>
</html>
