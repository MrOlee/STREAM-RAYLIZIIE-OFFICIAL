<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM RAYLIZIIE OFFICIAL</title>
  
  <!-- Tailwind CSS Compiled (Aman untuk Production di Vercel, Bebas Warning Console) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  
  <style>
    /* Custom Scrollbar untuk Card Slider */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen">

  <!-- NAVBAR -->
  <nav class="flex items-center justify-between px-6 py-4 bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">
        STREAM
      </div>
      <span class="text-sm font-semibold tracking-wide text-gray-300">RAYLIZIIE OFFICIAL</span>
    </div>
    
    <!-- Search Bar -->
    <div class="relative w-72">
      <input 
        type="text" 
        id="searchInput"
        placeholder="Cari tayangan..." 
        class="w-full bg-gray-800 text-sm text-white rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-orange-500 border border-gray-700"
      >
      <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
  </nav>

  <!-- FEATURED BANNER SECTION -->
  <header class="relative w-full bg-gradient-to-r from-gray-950 via-gray-900 to-transparent py-12 px-8 flex flex-col justify-center min-h-[350px]">
    <div class="max-w-2xl z-10">
      <span class="bg-orange-600 text-white text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider">
        FEATURED
      </span>
      <h1 id="featuredTitle" class="text-3xl sm:text-5xl font-extrabold mt-3 leading-tight">
        Kuroiwa Medaka ni Watashi no Kawaii ga Tsuujinai
      </h1>
      <p id="featuredDesc" class="text-gray-400 text-sm mt-3">
        Saksikan penayangan lengkapnya secara gratis di STREAM RAYLIZIIE OFFICIAL.
      </p>
      <div class="mt-6 flex space-x-4">
        <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2.5 rounded-lg flex items-center space-x-2 transition">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Tonton Sekarang</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="px-6 py-8 space-y-10">

    <!-- ANIME TERBARU & TRENDING SECTION -->
    <section>
      <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
        <span class="w-1.5 h-6 bg-orange-500 rounded-full"></span>
        <span>Anime Terbaru & Trending</span>
      </h2>
      
      <div id="animeContainer" class="flex space-x-4 overflow-x-auto no-scrollbar py-2">
        <!-- Card anime akan di-render di sini oleh JavaScript -->
        <div class="animate-pulse flex space-x-4">
          <div class="w-40 h-60 bg-gray-800 rounded-lg"></div>
          <div class="w-40 h-60 bg-gray-800 rounded-lg"></div>
          <div class="w-40 h-60 bg-gray-800 rounded-lg"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT FETCH ENGINE & FALLBACK HANDLER -->
  <script>
    // URL Placeholder baru yang stabil jika gambar utama gagal dimuat
    const FALLBACK_IMAGE = 'https://placehold.co/300x450/1e293b/ffffff?text=No+Poster';

    // Konfigurasi Base API (Sesuaikan jika endpoint menggunakan URL domain backend kamu)
    const API_BASE_URL = ''; 

    // Fungsi membuat Card Anime HTML
    function createAnimeCard(item) {
      // Pastikan URL gambar tidak null/empty, jika kosong langsung pakai fallback
      const coverUrl = item.cover_url || item.poster || item.image || FALLBACK_IMAGE;
      const title = item.title || 'Untitled Anime';
      const path = item.path || item.slug || '#';

      return `
        <div class="flex-none w-40 sm:w-48 bg-gray-900 rounded-lg overflow-hidden shadow-lg border border-gray-800 hover:border-orange-500 transition group cursor-pointer">
          <a href="/detail.html?path=${encodeURIComponent(path)}">
            <div class="relative aspect-[3/4] bg-gray-800">
              <img 
                src="${coverUrl}" 
                alt="${title}"
                loading="lazy"
                onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
              />
            </div>
            <div class="p-3">
              <h3 class="text-sm font-semibold text-white truncate group-hover:text-orange-400">
                ${title}
              </h3>
            </div>
          </a>
        </div>
      `;
    }

    // Fungsi Load Data dari API
    async function fetchHomeData() {
      const container = document.getElementById('animeContainer');
      
      try {
        const response = await fetch(`${API_BASE_URL}/animekompi/home`);
        const json = await response.json();

        console.log('[Response JSON /animekompi/home]:', json);

        if (json.code === 0 && json.data && json.data.length > 0) {
          container.innerHTML = json.data.map(item => createAnimeCard(item)).join('');
        } else {
          // Jika data kosong atau bermasalah
          container.innerHTML = `<p class="text-gray-500 text-sm">Tidak ada tayangan yang ditemukan.</p>`;
        }
      } catch (error) {
        console.error('Error fetching anime home:', error);
        container.innerHTML = `<p class="text-red-400 text-sm">Gagal memuat data tayangan.</p>`;
      }
    }

    // Jalankan fetch saat halaman selesai dimuat
    document.addEventListener('DOMContentLoaded', () => {
      fetchHomeData();
    });
  </script>
</body>
</html>
